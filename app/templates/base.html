<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 24px;
    width: fit-content;
    min-width: 800px;
  }
  .title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .tier-row {
    display: flex;
    align-items: stretch;
    margin-bottom: 4px;
    border-radius: 6px;
    overflow: hidden;
  }
  .tier-label {
    width: 64px;
    min-width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: #1a1a2e;
    text-shadow: 0 1px 2px rgba(255,255,255,0.2);
  }
  .tier-items {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    flex: 1;
    background: #16213e;
  }
  .item-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 80px;
  }
  .item-card img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 6px;
    background: #0f3460;
    padding: 4px;
  }
  .item-card .placeholder {
    width: 64px;
    height: 64px;
    border-radius: 6px;
    background: #0f3460;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #e94560;
  }
  .item-name {
    margin-top: 4px;
    font-size: 11px;
    text-align: center;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #ccc;
  }
</style>
</head>
<body>
  <div class="title">{{ tier.title }}</div>
  {% block tiers %}{% endblock %}
</body>
</html>
