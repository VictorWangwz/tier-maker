[project]
name = "auto-tier-maker"
version = "0.1.0"
description = "Generate beautiful tier-list images from natural language using AI, automatic image search, and headless browser rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "jinja2>=3.1.0",
    "playwright>=1.49.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "python-telegram-bot>=21.0.0",
    "langchain-openai>=0.3.0",
    "tavily-python>=0.5.0",
]
