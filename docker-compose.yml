services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiermaker
      POSTGRES_PASSWORD: tiermaker
      POSTGRES_DB: tiermaker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiermaker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tiermaker:tiermaker@db:5432/tiermaker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output

volumes:
  pgdata:
